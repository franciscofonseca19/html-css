<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>formulario 002</title>
</head>
<body>
    <h1>Segundo Formulário</h1>
    <form action="cadastro.java" method="post">
        <p><label for="inome">Nome:</label> <input type="text" name="Nome" id="inome" required minlength="6" maxlength="16"></p>

        <p><label for="isenh">Senha:</label> <input type="password" name="Senh" id="isenh" required minlength="4" maxlength="16" autocomplete="current-password"></p>
            <br>
           <input type="submit" value="Enviar">
           <input type="reset" value="Limpar">
    </form>
</body>
</html>
