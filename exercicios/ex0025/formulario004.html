<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkbox e Radio</title>
</head>
<body>
  <form action="Cadastro.java" method="post"></form>
 <fieldset>
    <legend>Seleciona o Seu Sexo</legend>
    <p>
        <label for="imas">Masculino</label>
        <input type="radio" name="Sexo" id="imas">
    </p>
    <p>
        <label for="ifem">Femenino</label>
        <input type="radio" name="Sexo" id="ifem">
    </p>
 </fieldset>
 <fieldset>
    <legend>Esports</legend>
    <label for="ifoot">Footboll</label>
    <input type="checkbox" name="Footboll" id="ifoot">
    <label for="ibakset">Bakset Bol</label>
    <input type="checkbox" name="Bakset" id="ibakset">
 </fieldset>
</body>
</html>
