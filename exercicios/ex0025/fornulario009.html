<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario</title>
</head>
<body>
    <form action="cadastro.java" method="post">
     <p>
        <label for="icor">Cor:</label>
        <input type="color" name="Cor" id="icor" value="#0000" >
     </p>

     <p>
       <label for="irange">Saturação:</label>
       <input type="range" name="Saturação" id="irange" min="0" max="100" value="50">
     </p>

     <p>
        <label for="ifile">Envio de arquivo:</label>
        <input type="file" name="Arquivo" id="ifile">
     </p>
      
     <p>
        <input type="submit" value="Enviar">
        <input type="reset" value="Apagar">
     </p>





    </form>
</body>
</html>
