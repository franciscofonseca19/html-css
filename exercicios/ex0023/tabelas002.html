<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabelas grandes</title>
    <style>
        body{
            font-family: Arial, Helvetica, sans-serif;
        }

        table{
            width: 400px;
            border-collapse: collapse;
        }
        td, th{
           border: 1px solid black;
           padding: 2px;
        }
        thead{
            background-color: darkgrey;
            color: white;

        }

        tfoot{
            background-color: darkgrey;
            color: white;
        }
        td.num{
           text-align: right ; 
        }
    </style>
</head>
<body>
    <h1>Trabalhando com tabelas grandes</h1>
    <table>
        <thead>
            <tr>
            <th>Estado</th>
            <th>População</th>
            </tr>
        </thead>

        <tbody>
            <tr>
                <td>Angola</td>
                <td class="num">1.000.000.000</td>
            </tr>
            <tr>
                <td>Brasil</td>
                <td class="num">1.000.000.00.</td>
            </tr>
            <tr>
                <td>America</td>
                <td class="num">1.000.000.000</td>
            </tr>
            <tfoot>
                <tr>
                    <th>Total de abitantes</th>
                    <td><strong>3.000.000.000</strong></td>

                </tr>
            </tfoot>
        </tbody>
    </table>
</body>
</html>
