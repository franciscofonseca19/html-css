<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flex Box</title>
    <style>
    *{
    margin: 0px;
    padding: 0px;
    box-sizing: border-box;

        }

    body{
        background-color: greenyellow;
        height: 100vh;
        width: 100vw;
    }

    main{
        
        background-color: blue;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        
    }

    section{
        padding: 10px;
        color: white;
        background-color: black;
        width: 300px;
        height: 400px;
        border-radius: 10px;
        font-family: Arial, Helvetica, sans-serif;


    }
    
    </style>
</head>
<body>
   <main>
    <section>
       <p>Nome<input type="text" name="texto" id="caixa"></p>
       <p> Passe:<input type="password" name="pass" id="caixa"></p>
       <p>Numero do tel <input type="number" name="numero" id="caixa"></p>
    </section>
   </main>
</body>
</html>
