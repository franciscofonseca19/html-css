<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flex Box</title>
    <style>
        .contrainer{
           display: flex;
           background-color: greenyellow;
           flex-flow: row nowrap;
           
            
             
        }

        .item{
           
           border: 1px solid black;
           text-align: center;
           flex-basis: 250px;
           
        }
    </style>
</head>
<body>
    <div class="contrainer">
        <div class="item">A contudo</div>
        <div class="item">B</div>
        <div class="item">C conteudo maior que o primeiro</div>
        <div class="item">D</div>
        <div class="item">E</div>
        <div class="item">F conteudo maior que o primeiro e segundo</div>
    </div>
</body>
</html>
