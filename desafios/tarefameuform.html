<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Formulário</title>
    <style>
        body{
          
            color: white;
            font-family: Arial, Helvetica, sans-serif;
            background-image: linear-gradient(80deg, red, red);

        }
        header{
            text-align: center;
        }

        main{
            background-color: black;
            height: 300px;
            width: 300px;
            padding: 10px;
            border-radius: 15px;
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50% ,-50%);
        }

        input.nome{
            padding: 5px;
            border: none;
           border: none;
        }

        input.passe{
            padding: 5px;
        }
         

    </style>
</head>
<body>
    <header>
        <h1>Meu 1º Formulário</h1>
    </header>
    <main>
        <form action="castro.java" method="post">
            <p><label for="inome">Nome</label>: <input type="text" name="nome" id="inome" required class="nome"></p>
             
            <p><label for="isenha">Senha:</label> 
            <input type="password" name="Senha" id="isenha"
            required class="passe">
             <br> 
            <input type="submit" value="Enviar" class="enviar">
            
            <input type="reset" value="Limpar" class="Limpar">
        </form>
    </main>
</body>
</html>
